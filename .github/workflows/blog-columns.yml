name: Blog columns publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = 발행 없이 미리보기만"
        default: "false"
      task:
        description: "publish(기본) | label-reviews(설치후기 라벨 일괄 부여)"
        default: "publish"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish columns to Blogger
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          if [ "${{ github.event.inputs.task }}" = "label-reviews" ]; then
            node scripts/label-reviews.mjs
          elif [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            node scripts/blog-columns.mjs --dry-run
          else
            node scripts/blog-columns.mjs
          fi
